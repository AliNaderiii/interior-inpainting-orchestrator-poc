name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Dependency diagnostics
        run: python -c "import platform, numpy; print(platform.python_version(), numpy.__version__)"
      - name: Ruff lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: Ruff format
        if: matrix.python-version == '3.11'
        run: ruff format --check .
      - name: Strict mypy against minimum supported Python
        if: matrix.python-version == '3.11'
        run: mypy src/inpainting_poc
      - name: Static showcase security and JavaScript syntax
        if: matrix.python-version == '3.11'
        run: |
          python scripts/validate_static_site.py
          node --check site/app.js
          node --check site/studio.js
      - name: Tests
        run: pytest -q -m 'not live_provider'
