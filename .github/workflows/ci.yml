name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Dependency diagnostics
        run: python -c "import platform, numpy; print(platform.python_version(), numpy.__version__)"
      - name: Ruff lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: Ruff format
        if: matrix.python-version == '3.11'
        run: ruff format --check .
      - name: Strict mypy against minimum supported Python
        if: matrix.python-version == '3.11'
        run: mypy src/inpainting_poc
      - name: Tests
        run: pytest -q -m 'not live_provider'
